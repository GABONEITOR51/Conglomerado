<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reporte de Proveedor (lite) · 805 MultiServices</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:#fff;
    color:#000;
    font-family:"Courier New",Consolas,monospace;
    font-size:11px;
    line-height:1.3;
  }
  .sheet{
    width:100%;
    max-width:8.5in;
    margin:0 auto;
    padding:0.35in;
  }
  h1{font-size:14px;margin:0 0 2px;text-transform:uppercase;letter-spacing:.5px}
  .sub{font-size:11px;margin:0 0 10px}
  /* ==== STATEMENT VIAMERICAS (tabla superior, nombres del proveedor) ====
     v29: las 3 columnas (Envios/Otros/Balance) viven en UN SOLO CSS Grid
     en vez de 3 tablas independientes. Cada "fila logica" (fila 1, fila 2...
     fila Total) ocupa la MISMA fila de grid para las 3 columnas, y el grid
     ajusta automaticamente la altura de esa fila a la celda mas alta de
     las 3 (por ejemplo si un concepto hace wrap a 2 lineas en una columna).
     Resultado: el renglon "Total" de las 3 columnas SIEMPRE queda en la
     misma linea horizontal, pegado justo debajo del ultimo concepto real,
     sin importar el motor de render (pantalla, impresion o PDF) y sin
     necesidad de filas de relleno manuales ni de flexbox. */
  .stmt{
    display:grid;
    grid-template-columns: 1fr 34px 88px  1fr 34px 88px  1fr 88px;
    border:1.5px solid #000;margin:0 0 6px;break-inside:avoid;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
  }
  .stmt .gcell{padding:3px 5px;font-size:11px}
  .stmt .gcell.c{text-align:left;white-space:normal;word-break:break-word}
  .stmt .gcell.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .stmt .gcell.a{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .stmt .gh{text-align:center;font-weight:bold;font-size:12px;padding:5px 4px;
          border-bottom:1.5px solid #000;letter-spacing:.3px}
  .stmt .gh.bal{color:#8a8a8a}
  .stmt .bold{font-weight:bold}
  .stmt .sep{border-top:1px solid #000}
  .stmt .red{color:#d00}
  .stmt .hl{background:#dbe7ff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .stmt .divider{border-right:1px solid #000}
  .stmt-note{font-size:9px;font-style:italic;margin:0 0 14px;line-height:1.3}
  .stmt-warn{font-size:10px;font-weight:bold;color:#d00;border:1px solid #d00;padding:3px 6px;margin:0 0 10px}
  /* ===================================================================== */
  .groups{margin:0 0 14px}
  .grupo{border:1.5px solid #000;margin-bottom:7px;break-inside:avoid}
  .grupo .ghdr{display:flex;justify-content:space-between;align-items:baseline;
    background:#e6e6e6;padding:3px 6px;font-weight:bold;font-size:12px;
    text-transform:uppercase;letter-spacing:.3px;border-bottom:1px solid #000;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  .grupo .ghdr .gt{font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:10px}
  .grupo .grow{display:grid;grid-template-columns:1fr 120px;column-gap:12px;padding:1px 6px}
  .grupo .grow span:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .grupo .grow.l1 span:first-child{padding-left:10px}
  .grupo .grow.l2 span:first-child{padding-left:24px;font-size:10px}
  .grupo .grow.l2 span:last-child{font-size:10px}
  .leyenda{font-size:9px;font-style:italic;line-height:1.25;margin-top:1px}
  .sec{margin-bottom:14px;break-inside:avoid}
  .sec h2{
    font-size:12px;margin:0;padding:2px 0;
    border-bottom:1px solid #000;text-transform:uppercase;
    display:flex;justify-content:space-between;align-items:baseline;
  }
  .sec .cnt{font-weight:normal;font-size:10px}
  .sec h2 .tot{font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:10px}
  .sec h3.sub2{
    font-size:11px;margin:7px 0 0;padding:1px 0;
    border-bottom:1px dashed #000;text-transform:uppercase;font-weight:bold;
    display:flex;justify-content:space-between;align-items:baseline;
  }
  .sec h3.sub2 .tot{font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:10px}
  table{width:100%;border-collapse:collapse;margin-top:2px;table-layout:fixed}
  th,td{padding:1px 3px;text-align:left;vertical-align:top;border-bottom:1px dotted #999;
        overflow:hidden;text-overflow:ellipsis}
  th{font-weight:bold;border-bottom:1px solid #000}
  td.r,th.r{text-align:right;white-space:nowrap}
  td.nw,th.nw{white-space:nowrap}
  td.name{white-space:normal;word-break:break-word}
  .empty{padding:4px 0;font-style:italic}
  .print-btn{
    position:fixed;right:14px;bottom:14px;
    background:#000;color:#fff;border:none;border-radius:4px;
    padding:8px 14px;font-size:12px;cursor:pointer;
  }
  @page{size:letter portrait;margin:0.35in}
  @media print{
    .print-btn{display:none}
    thead{display:table-header-group}
    tr{break-inside:avoid}
    .sec{break-inside:avoid}
  }
</style>
</head>
<body>
<div class="sheet" id="sheet"></div>
<button class="print-btn" onclick="window.print()">Imprimir / PDF</button>
<script>
/* =====================================================================
   REPORTE DE PROVEEDOR (lite) - v30
   ---------------------------------------------------------------------
   Contrato de datos (compatible con la misma Action de AppSheet):
     #d=HEADER||VENTAS||SALIDAS||CHEQUES||CANCELACIONES||PAGOS
     sec sep: ||   fila sep: ~~   campo sep: ^

   HEADER: 0 proveedor 1 fechaIni 2 fechaFin 3 logoURL(ignorado)
           4..8 totales legacy (IGNORADOS: se recalculan en JS)
           9 generadoPor
           10 balanceInicial (saldo final del periodo anterior)  [opcional]
           11 debitosManuales (SOLO ajustes que NO son cancelaciones TCD) [opcional]

   VENTAS/SALIDAS/CHEQUES: 0 fecha 1 hora 2 cliente 3 servicio
                           4 formaPago 5 monto 6 observacion 7 tipoEnvio
   CANC:  igual + 8 tipoCancel  ("CANCELACION" | "PAY_OUT")
   PAGOS: 0 fecha 1 referencia 2 monto 3 formaPago 4 observacion

   =====================================================================
   NOVEDAD v30 - PRODUCTO "RECARGA"
   ---------------------------------------------------------------------
   El eje PRODUCTO ahora tiene 3 valores: 'mt' | 'bill' | 'rec'.
     [TipoEnvio] contiene "recarga", "pin" o "top up" -> 'rec'
   Lineas nuevas (columna Otros Servicios):
     Recargas / Pin       = VENTAS, producto=rec
     Recargas Canceladas  = CANC (tipo=CANCELACION), producto=rec
   Total Otros Servicios = (Biles - Biles Canc) + (Recargas - Recargas Canc)

   ANTES de v30 una recarga caia en 'mt' (todo lo que no era bill era
   envio), o sea se sumaba a "Envios De Dinero". Eso ya no pasa.

   El invariante TCD se conserva para recargas: una recarga TCD suma en
   Otros y resta en Creditos (neto 0); su cancelacion resta en Recargas
   Canceladas y suma en Debitos (neto 0).

   PAY_OUT solo tiene sentido para money transfer. Un PAY_OUT con
   producto bill o rec no cae en ninguna linea del statement: se muestra
   una ALERTA en rojo en vez de perderlo en silencio.

   =====================================================================
   v28 - SEPARACION CANCELACION / PAY_OUT
   ---------------------------------------------------------------------
     TipoCancel = "CANCELACION" -> linea "... Cancelados"
     TipoCancel = "PAY_OUT"     -> linea "Pago de Envios"
   Filas SIN [TipoCancel] se tratan como CANCELACION.
   Los Debitos TCD se calculan SOLO sobre las cancelaciones reales.

   =====================================================================
   MODELO CANONICO (v27) - VALIDADO CONTRA EL STATEMENT REAL DE JULIO 2026
   ---------------------------------------------------------------------
     eje PRODUCTO     : 'mt' | 'bill' | 'rec'      <- [TipoEnvio] idx 7
     eje LIQUIDACION  : 'card' (TCD) | 'cash'      <- [FormaPago] idx 4
     eje SIGNO        : 'alta' (VENTAS) | 'canc'   <- seccion del payload

     Money Transfers            = VENTAS, producto=mt
     Money Transfers - Canceled = CANC (CANCELACION), producto=mt
     Pago de Envios             = CANC (PAY_OUT),     producto=mt
     Bill Payment               = VENTAS, producto=bill
     Bill Payment Canceled      = CANC (CANCELACION), producto=bill
     Recargas / Pin             = VENTAS, producto=rec          <- v30
     Recargas Canceladas        = CANC (CANCELACION), producto=rec  <- v30
     Credits  (se RESTA)        = VENTAS, liquidacion=card
     Debits   (se SUMA)         = CANC (CANCELACION), liquidacion=card

   INVARIANTE: toda transaccion TCD tiene efecto NETO CERO sobre el saldo.

   PRUEBA (statement Viamericas 07/01/2026 - 07/09/2026):
     Balance: 4,896.52 + 31,412.06 + 105.46 - 1,159.54 - 17,800.00
              + 200.00 - 3,145.00 = 14,509.50 = "Total To Deposit" [OK]

   REQUISITOS DE DATOS (criticos):
     1. El campo monto (idx 5) debe ser el TOTAL cobrado (envio + fee + taxes).
     2. HEADER[11] es SOLO para ajustes que NO son cancelaciones TCD.
   ===================================================================== */
const SEC='||', REC='~~', F='^';
const DEMO_H = ["VIAMERICAS","1/7/2026","9/7/2026","","0","0","0","0","0","805 MultiServices","4896.52",""];
const DEMO_VENTAS=[
  ["7/3/2026","10:12 AM","MARTINEZ SAUL","ENVIO/","TCD","400","tx 1674","Money Transfer"],
  ["7/4/2026","11:03 AM","FRANCISCO JOSE","ENVIO/","TCD","210","tx 1683","Money Transfer"],
  ["7/8/2026","2:41 PM","VICENTE TAPIA","ENVIO/","TCD","1522.50","tx 1698","Money Transfer"],
  ["7/8/2026","4:02 PM","CORDOVA OSCAR","ENVIO/","TCD","1012.50","tx 1709","Money Transfer"],
  ["7/1/2026","9:30 AM","JESUS GONZALEZ ROMERO","ENVIO/","EFECTIVO","82.50","PG&E","Bill Paymnt"],
  ["7/3/2026","1:15 PM","MINERVA CARRILLO ESPINO","ENVIO/","EFECTIVO","22.96","TJX","Bill Paymnt"],
  ["7/5/2026","12:10 PM","LUIS PEREZ","ENVIO/","EFECTIVO","20","Telcel","Recarga"],
  ["7/7/2026","3:45 PM","MARIA SANCHEZ","ENVIO/","EFECTIVO","30","AT&T","Recarga"]
];
const DEMO_SALIDAS=[];
const DEMO_CHEQUES=[
  ["7/1/2026","","CP - DEPOSIT VC2","CHEQUE","EFECTIVO","1008.47",""],
  ["7/7/2026","","CP - DEPOSIT VC2","CHEQUE","EFECTIVO","151.07",""]
];
const DEMO_CANC=[
  ["7/1/2026","10:05 AM","FRANCISCO JOSE","CANCELACION","TCD","200","cancel tx 1652 (venta de JUNIO)","Money Transfer","CANCELACION"],
  ["7/4/2026","3:20 PM","GABRIEL HERNANDEZ","CANCELACION","EFECTIVO","111","cancel tx 1666","Money Transfer","CANCELACION"],
  ["7/8/2026","5:44 PM","NICOLAS CARRILLO","CANCELACION","EFECTIVO","2040","cancel tx 1667","Money Transfer","CANCELACION"],
  ["7/6/2026","11:20 AM","ROSA MARIA JIMENEZ","PAYOUT","EFECTIVO","650","payout tx 1690","Money Transfer","PAY_OUT"],
  ["7/9/2026","1:05 PM","ANTONIO LOPEZ LOPEZ","PAYOUT","EFECTIVO","300","payout tx 1712","Money Transfer","PAY_OUT"],
  ["7/5/2026","12:30 PM","LUIS PEREZ","CANCELACION","EFECTIVO","20","cancel recarga Telcel","Recarga","CANCELACION"]
];
const DEMO_PAGOS=[
  ["7/1/2026","BAI Deposit Agent - ATM","3600.00","ATM",""],
  ["7/6/2026","BAI Deposit Agent - ATM","3500.00","ATM",""],
  ["7/7/2026","DIRECT BANK ATM","6500.00","ATM",""],
  ["7/8/2026","SMS Deposit Agent - ATM","4200.00","ATM",""]
];
function smartDecode(raw){
  let s=raw;
  try{ s=decodeURIComponent(raw); }catch(e){ s=raw; }
  if(s.indexOf(SEC)===-1 && /%[0-9A-Fa-f]{2}/.test(s)){
    try{ s=decodeURIComponent(s); }catch(e){}
  }
  return s;
}
function splitRows(sectionStr){
  const t=(sectionStr||"").trim();
  if(!t) return [];
  return t.split(REC).map(s=>s.trim()).filter(s=>s!=="").map(r=>r.split(F));
}
function readPayload(){
  let raw="";
  const h=location.hash||"";
  if(h.indexOf("#d=")===0) raw=h.slice(3);
  else if(new URLSearchParams(location.search).get("d")) raw=new URLSearchParams(location.search).get("d");
  if(!raw) return null;
  raw=smartDecode(raw);
  const parts=raw.split(SEC);
  const H=(parts[0]||"").split(F);
  return {
    H,
    VENTAS: splitRows(parts[1]),
    SALIDAS: splitRows(parts[2]),
    CHEQUES: splitRows(parts[3]),
    CANC: splitRows(parts[4]),
    PAGOS: splitRows(parts[5])
  };
}
function toNum(v){
  if(v===undefined||v===null) return 0;
  const n=parseFloat((""+v).replace(/[^0-9.\-]/g,""));
  return isNaN(n)?0:n;
}
function sumRows(rows,idx){
  if(!rows||!rows.length) return 0;
  return rows.reduce((a,r)=>a+toNum(r[idx]),0);
}
function money(v){return "$"+toNum(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});}
/* Decimales originales de AppSheet en montos individuales (v29.1). */
function decimalsIn(raw){
  const s=(raw==null?'':(''+raw)).replace(/[^0-9.\-]/g,'');
  const m=s.match(/\.(\d+)/);
  return m ? Math.min(m[1].length,6) : 0;
}
function moneyD(v,decimals){
  const d=Math.max(2,decimals||0);
  return "$"+toNum(v).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
}
/* money2: signo menos ANTES del $, con centavos; 0 -> celda en blanco. */
function money2(v){
  const n=toNum(v);
  if(Math.abs(n)<0.005) return "";
  return (n<0?"-":"")+"$"+Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
}
function esc(s){return (s==null?"":""+s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function stripQuote(s){return (s==null?"":(""+s)).replace(/^['`´‘’]+/,'').trim();}
function cleanDT(s){return (s==null?"":(""+s)).replace(/^[^\d]+/,'').trim();}
function nameObs(name,obs){
  const n=esc(name||'');
  const o=(obs==null?'':(''+obs)).trim();
  return o ? n+' / '+esc(o) : n;
}
function cut(s,n){s=stripQuote(s); return s.length>n?s.slice(0,n):s;}

/* =====================================================================
   EJES CANONICOS DE CLASIFICACION
   ===================================================================== */
function esTCD(fp){
  fp=(fp==null?'':(''+fp)).toLowerCase();
  return /\btcd\b|pago directo cliente|cliente\s*directo|directo a compa/.test(fp);
}
/* Eje PRODUCTO: usa SOLO [TipoEnvio] (idx 7). [Servicio] (idx 3) llega
   como "ENVIO/" para todo, no sirve para distinguir.
   v30: 'rec' para recargas. Orden: bill -> rec -> mt (default). */
function ejeProducto(r){
  const t=(''+(r[7]||'')).toLowerCase();
  if(/bill/.test(t)) return 'bill';
  if(/recarga|\bpin\b|top[\s_-]*up/.test(t)) return 'rec';
  return 'mt';
}
function ejeLiquid(r){ return esTCD(r[4]) ? 'card' : 'cash'; }
/* Eje TIPO DE BAJA: [TipoCancel] (idx 8) y nada mas. Vacio = CANCELACION. */
function esPayout(r){
  const t=(''+(r[8]||'')).toLowerCase();
  return /pay[\s_-]*out/.test(t);
}
function montoAbs(r){ return Math.abs(toNum(r[5])); }
/* Agregador generico por ejes. prod/liq = null -> no filtra por ese eje. */
function agrupa(rows,prod,liq){
  const s=(rows||[]).filter(r =>
    (!prod || ejeProducto(r)===prod) && (!liq || ejeLiquid(r)===liq));
  return { n:s.length, s:s.reduce((a,r)=>a+montoAbs(r),0), rows:s };
}

/* ---- Clasificadores de presentacion (secciones de detalle) ---- */
function ventaTipo(r){
  if(ejeLiquid(r)==='card') return 'credito';
  const p=ejeProducto(r);
  return p==='bill' ? 'bill' : (p==='rec' ? 'recarga' : 'envio');
}
function cancTipo(r){ return ejeLiquid(r)==='card' ? 'tarjeta' : 'otra'; }

/* =====================================================================
   TABLAS DE DETALLE
   ===================================================================== */
const COLS_A=`<colgroup>
  <col style="width:18%">
  <col style="width:53%">
  <col style="width:9%">
  <col style="width:8%">
  <col style="width:12%">
</colgroup>`;
function tablaTipoA(rows){
  if(!rows.length) return `<div class="empty">Sin movimientos</div>`;
  const trs=rows.map(r=>`<tr>
    <td class="nw">${esc(cleanDT(r[0]))} ${esc(cleanDT(r[1]))}</td>
    <td class="name">${nameObs(r[2],r[6])}</td>
    <td class="nw">${esc(cut(r[3],6))}</td>
    <td class="nw">${esc(cut(r[4],5))}</td>
    <td class="r">${moneyD(montoAbs(r),decimalsIn(r[5]))}</td>
  </tr>`).join("");
  return `<table>
    ${COLS_A}
    <thead><tr><th class="nw">Fecha/Hora</th><th>Cliente / Obs.</th><th>Servicio</th><th>F.Pago</th><th class="r">Monto</th></tr></thead>
    <tbody>${trs}</tbody>
  </table>`;
}
function sumAbs(rows){ return (rows||[]).reduce((a,r)=>a+montoAbs(r),0); }
function subBloque(titulo,rows){
  return `<h3 class="sub2"><span>${titulo} <span class="cnt">(${rows.length} mov.)</span></span><span class="tot">${money(sumAbs(rows))}</span></h3>${tablaTipoA(rows)}`;
}
function ventasBloques(rows){
  const env =rows.filter(r=>ventaTipo(r)==='envio');
  const bil =rows.filter(r=>ventaTipo(r)==='bill');
  const rec =rows.filter(r=>ventaTipo(r)==='recarga');
  const cred=rows.filter(r=>ventaTipo(r)==='credito');
  if(env.length===0 && bil.length===0 && rec.length===0 && cred.length===0) return tablaTipoA(rows);
  let html=subBloque('Envios (Money Transfer)',env)+subBloque('Pago de biles (Bill Payment)',bil);
  if(rec.length) html+=subBloque('Recargas / Pin',rec);
  if(cred.length) html+=subBloque('Creditos (cliente directo a compania)',cred);
  return html;
}
function cancBloques(rows){
  const tar=rows.filter(r=>cancTipo(r)==='tarjeta');
  const otr=rows.filter(r=>cancTipo(r)==='otra');
  if(tar.length===0) return tablaTipoA(rows);
  let html=subBloque('Debito por cancelacion de tarjeta (TCD)',tar);
  if(otr.length) html+=subBloque('Cancelaciones (efectivo / otras)',otr);
  return html;
}
function tablaPagos(rows){
  if(!rows.length) return `<div class="empty">Sin pagos registrados</div>`;
  const trs=rows.map(r=>`<tr>
    <td class="nw">${esc(cleanDT(r[0]))}</td>
    <td class="name">${nameObs(r[1],r[4])}</td>
    <td class="nw">${esc(cut(r[3],5))}</td>
    <td class="r">${moneyD(Math.abs(toNum(r[2])),decimalsIn(r[2]))}</td>
  </tr>`).join("");
  return `<table>
    <colgroup>
      <col style="width:18%"><col style="width:62%"><col style="width:8%"><col style="width:12%">
    </colgroup>
    <thead><tr><th class="nw">Fecha</th><th>Referencia / Obs.</th><th>F.Pago</th><th class="r">Monto</th></tr></thead>
    <tbody>${trs}</tbody>
  </table>`;
}

/* =====================================================================
   STATEMENT VIAMERICAS (tabla superior)
   ===================================================================== */
function stCellA(concepto,cant,monto,cls){
  const c=(cant===null||cant===undefined||cant===0)?'':(''+cant);
  return {concepto, cant:c, monto:money2(monto), cls:cls||''};
}
function stCellB(concepto,monto,cls){
  return {concepto, monto:money2(monto), cls:cls||''};
}
function gcell(col,row,cls,text){
  return `<div class="gcell ${cls}" style="grid-column:${col};grid-row:${row}">${text}</div>`;
}
function renderGroup3(rows,colC,colN,colA,startRow,maxBody,divider){
  let h='';
  for(let i=0;i<maxBody;i++){
    const r=rows[i], row=startRow+i, cls=r?r.cls:'';
    h+=gcell(colC,row,'c '+cls, r?r.concepto:'&nbsp;');
    h+=gcell(colN,row,'n '+cls, r?r.cant:'');
    h+=gcell(colA,row,'a '+cls+(divider?' divider':''), r?r.monto:'');
  }
  return h;
}
function renderGroup2(rows,colC,colA,startRow,maxBody){
  let h='';
  for(let i=0;i<maxBody;i++){
    const r=rows[i], row=startRow+i, cls=r?r.cls:'';
    h+=gcell(colC,row,'c '+cls, r?r.concepto:'&nbsp;');
    h+=gcell(colA,row,'a '+cls, r?r.monto:'');
  }
  return h;
}
function statementTable(S,T,balIni,balIniSet,debManual,debSet){
  /* ---- Columna 1: Envios De Dinero ---- */
  const subN=S.mtAlta.n-S.mtCanc.n, subA=S.mtAlta.s-S.mtCanc.s;
  const totN=subN-S.mtPay.n,        totA=subA-S.mtPay.s;
  /* ---- Columna 2: Otros Servicios (v30: biles + recargas) ---- */
  const otrN=(S.bilAlta.n-S.bilCanc.n)+(S.recAlta.n-S.recCanc.n);
  const otrA=(S.bilAlta.s-S.bilCanc.s)+(S.recAlta.s-S.recCanc.s);
  /* ---- Columna 3: Balance ---- */
  const bEnv=totA, bOtr=otrA;
  const bChq=-T.cheques, bDep=-T.pagos;
  const bDeb=S.debits.s+debManual;
  const bCred=-S.credits.s;
  const bTot=toNum(balIni)+bEnv+bOtr+bChq+bDep+bDeb+bCred;

  const rowsA=[
    stCellA('Envíos De Dinero',S.mtAlta.n,S.mtAlta.s),
    stCellA('Envíos De Dinero - Cancelados',S.mtCanc.n?(-S.mtCanc.n):0,-S.mtCanc.s),
    stCellA('Envíos De Dinero - Anulados',0,0,'red'),
    stCellA('Subtotal',subN,subA,'bold sep'),
    stCellA('Pago de Envíos',S.mtPay.n?(-S.mtPay.n):0,-S.mtPay.s)
  ];
  const rowsB=[
    stCellA('Pago de Biles',S.bilAlta.n,S.bilAlta.s),
    stCellA('Pagos de Biles Cancelados',S.bilCanc.n?(-S.bilCanc.n):0,-S.bilCanc.s),
    stCellA('Pago de Biles Int.',0,0,'red'),
    stCellA('Money Orders',0,0,'red'),
    stCellA('Recargas / Pin',S.recAlta.n,S.recAlta.s),
    stCellA('Recargas Canceladas',S.recCanc.n?(-S.recCanc.n):0,-S.recCanc.s)
  ];
  const rowsC=[
    stCellB('Balance Inicial',balIni,balIniSet?'':'red'),
    stCellB('Envíos De Dinero',bEnv),
    stCellB('Otros Servicios',bOtr),
    stCellB('Cheques Acreditados',bChq),
    stCellB('Depósitos / Viasafe',bDep,'hl'),
    stCellB('Débitos',bDeb),
    stCellB('Créditos',bCred)
  ];

  const maxBody = Math.max(rowsA.length, rowsB.length, rowsC.length);
  const bodyStart = 2;
  const totalRow  = bodyStart+maxBody;

  let html = '';
  html += gcell('1/4','1','gh divider','Envíos De Dinero');
  html += gcell('4/7','1','gh divider','Otros Servicios');
  html += gcell('7/9','1','gh bal','Balance');

  html += renderGroup3(rowsA,1,2,3,bodyStart,maxBody,true);
  html += renderGroup3(rowsB,4,5,6,bodyStart,maxBody,true);
  html += renderGroup2(rowsC,7,8,bodyStart,maxBody);

  html += gcell(1,totalRow,'c bold sep','Total');
  html += gcell(2,totalRow,'n bold sep', totN?(''+totN):'');
  html += gcell(3,totalRow,'a bold sep divider', money2(totA));
  html += gcell(4,totalRow,'c bold sep','Total');
  html += gcell(5,totalRow,'n bold sep', otrN?(''+otrN):'');
  html += gcell(6,totalRow,'a bold sep divider', money2(otrA));
  html += gcell(7,totalRow,'c bold sep','Total');
  html += gcell(8,totalRow,'a bold sep', money2(bTot));

  const notaDeb = S.debits.n>0
    ? `<b>Débitos</b> = ${S.debits.n} cancelación(es) pagada(s) con tarjeta (TCD) por ${money(S.debits.s)}${debManual?` + ${money(debManual)} de ajuste manual`:''}: revierten el crédito de la venta original.`
    : `<b>Débitos</b>: sin cancelaciones TCD en el periodo.`;
  const notaPay = S.mtPay.n>0
    ? ` <b>Pago de Envíos</b> = ${S.mtPay.n} pay out(s) por ${money(S.mtPay.s)}: efectivo entregado al beneficiario, resta del Total.`
    : ``;
  /* v30: PAY_OUT de bill/recarga no cae en ninguna linea -> alerta visible */
  const warn = S.payHuerf.n>0
    ? `<div class="stmt-warn">ALERTA: ${S.payHuerf.n} registro(s) PAY_OUT con TipoEnvio que no es Money Transfer (${money(S.payHuerf.s)}). No se suman en ninguna línea del statement: revisa [TipoCancel] o [TipoEnvio] en AppSheet.</div>`
    : ``;
  return `<div class="stmt">${html}</div>
  ${warn}
  <div class="stmt-note">Statement de proveedor (Viamericas) &middot; v30. <b style="color:#d00">Valores en rojo</b> = sin dato en el reporte: editar manualmente. Balance Inicial = saldo final del periodo anterior. Cheques Acreditados y Depósitos/Viasafe son abonos (restan al saldo a depositar). ${notaDeb}${notaPay}</div>`;
}

/* ===================================================================== */
function pad2(n){n=parseInt(n,10)||0; return (n<10?'0':'')+n;}
function fileDate(s){
  s=cleanDT(s);
  const m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if(!m) return s.replace(/[^\w-]/g,'');
  return pad2(m[1])+'-'+pad2(m[2])+'-'+m[3];
}
function fileProv(s){
  s=(""+(s||'')).trim();
  const t=s.replace(/[^A-Za-zÀ-ÿ]/g,'').slice(0,3);
  return t.charAt(0).toUpperCase()+t.slice(1).toLowerCase();
}
function render(P){
  const H=P.H, g=i=>H[i]!==undefined?H[i]:"";

  const CANC_PAY  = (P.CANC||[]).filter(r=>  esPayout(r));
  const CANC_REAL = (P.CANC||[]).filter(r=> !esPayout(r));

  const S={
    mtAlta : agrupa(P.VENTAS, 'mt',  null),
    mtCanc : agrupa(CANC_REAL,'mt',  null),
    mtPay  : agrupa(CANC_PAY, 'mt',  null),
    bilAlta: agrupa(P.VENTAS, 'bill',null),
    bilCanc: agrupa(CANC_REAL,'bill',null),
    recAlta: agrupa(P.VENTAS, 'rec', null),   // v30: Recargas / Pin
    recCanc: agrupa(CANC_REAL,'rec', null),   // v30: Recargas Canceladas
    credits: agrupa(P.VENTAS,  null,'card'),
    debits : agrupa(CANC_REAL, null,'card')
  };
  /* v30: PAY_OUT que no es money transfer (no entra a ninguna linea) */
  const huerf = CANC_PAY.filter(r=>ejeProducto(r)!=='mt');
  S.payHuerf = { n:huerf.length, s:sumAbs(huerf), rows:huerf };

  const T={
    ventas:    sumAbs(P.VENTAS),
    ventasEnv: sumAbs(P.VENTAS.filter(r=>ventaTipo(r)==='envio')),
    ventasBil: sumAbs(P.VENTAS.filter(r=>ventaTipo(r)==='bill')),
    ventasRec: sumAbs(P.VENTAS.filter(r=>ventaTipo(r)==='recarga')),
    ventasCred:S.credits.s,
    salidas:   sumAbs(P.SALIDAS),
    cheques:   sumAbs(P.CHEQUES),
    canc:      sumAbs(CANC_REAL),
    payout:    sumAbs(CANC_PAY),
    cancTar:   S.debits.s,
    cancOtra:  sumAbs(CANC_REAL.filter(r=>cancTipo(r)==='otra')),
    pagos:     (P.PAGOS||[]).reduce((a,r)=>a+Math.abs(toNum(r[2])),0)
  };

  const balIniSet = H[10]!==undefined && (''+H[10]).trim()!=='';
  const balIni    = toNum(H[10]);
  const debSet    = H[11]!==undefined && (''+H[11]).trim()!=='';
  const debManual = toNum(H[11]);

  document.title = `${fileProv(g(0))}_${fileDate(g(1))}_${fileDate(g(2))}`;
  document.getElementById("sheet").innerHTML=`
  <h1>Reporte de proveedor: ${esc(g(0)||'PROVEEDOR')}</h1>
  <div class="sub">805 MultiServices &middot; Periodo: ${esc(cleanDT(g(1)))} a ${esc(cleanDT(g(2)))} &middot; Generado por: ${esc(g(9)||'-')} &middot; v30</div>
  ${statementTable(S,T,balIni,balIniSet,debManual,debSet)}
  <div class="groups">
    <div class="grupo">
      <div class="ghdr"><span>Entradas &middot; Ventas (+)</span><span class="gt">${money(T.ventas)}</span></div>
      <div class="grow l1"><span>Envios (Money Transfer)</span><span>${money(T.ventasEnv)}</span></div>
      <div class="grow l1"><span>Pago de biles (Bill Payment)</span><span>${money(T.ventasBil)}</span></div>
      <div class="grow l1"><span>Recargas / Pin</span><span>${money(T.ventasRec)}</span></div>
      ${T.ventasCred>0 ? `<div class="grow l1"><span>Creditos TCD (cliente directo) &rarr; se resta en Balance</span><span>${money(T.ventasCred)}</span></div>` : ``}
    </div>
    <div class="grupo">
      <div class="ghdr"><span>Salidas &middot; Abonos (&minus;)</span><span class="gt">${money(T.cheques+T.canc+T.payout)}</span></div>
      <div class="grow l1"><span>Cheques acreditados</span><span>${money(T.cheques)}</span></div>
      <div class="grow l1"><span>Cancelaciones</span><span>${money(T.canc)}</span></div>
      ${T.cancTar>0 ? `
      <div class="grow l2"><span>Con tarjeta (TCD) &rarr; genera Debito de igual monto</span><span>${money(T.cancTar)}</span></div>
      <div class="grow l2"><span>Efectivo / otras &rarr; sin debito</span><span>${money(T.cancOtra)}</span></div>` : ``}
      <div class="grow l1"><span>Pago de envios (pay out)</span><span>${money(T.payout)}</span></div>
    </div>
    <div class="grupo">
      <div class="ghdr"><span>Pagos realizados &middot; Depositos (&minus;)</span><span class="gt">${money(T.pagos)}</span></div>
    </div>
    <div class="leyenda">(+) Entradas: suman &middot; (&minus;) Abonos/Liquidaciones: reducen el saldo a depositar. <b>Cheques acreditados</b> = "Credited Checks": es un abono, <b>no</b> un ingreso. Toda transaccion <b>TCD</b> tiene efecto neto CERO: al alta se resta como Credito, al cancelarse se suma como Debito. <b>Pago de envios</b> = efectivo entregado al beneficiario: resta del Total de envios, no genera debito.</div>
  </div>
  <div class="sec">
    <h2><span>Cancelaciones <span class="cnt">(${CANC_REAL.length} mov.)</span></span><span class="tot">${money(T.canc)}</span></h2>
    ${cancBloques(CANC_REAL)}
  </div>
  <div class="sec">
    <h2><span>Pago de envios (pay out) <span class="cnt">(${CANC_PAY.length} mov.)</span></span><span class="tot">${money(T.payout)}</span></h2>
    ${tablaTipoA(CANC_PAY)}
  </div>
  <div class="sec">
    <h2><span>Cheques acreditados <span class="cnt">(${P.CHEQUES.length} mov. &middot; abono, no es ingreso)</span></span><span class="tot">${money(T.cheques)}</span></h2>
    ${tablaTipoA(P.CHEQUES)}
  </div>
  <div class="sec">
    <h2><span>Depositos (Pagos realizados) <span class="cnt">(${P.PAGOS.length} mov.)</span></span><span class="tot">${money(T.pagos)}</span></h2>
    ${tablaPagos(P.PAGOS)}
  </div>
  <div class="sec">
    <h2><span>Ventas <span class="cnt">(${P.VENTAS.length} mov.)</span></span><span class="tot">${money(T.ventas)}</span></h2>
    ${ventasBloques(P.VENTAS)}
  </div>
  `;
}
(function(){
  const p=readPayload();
  if(p){ render(p); }
  else { render({H:DEMO_H,VENTAS:DEMO_VENTAS,SALIDAS:DEMO_SALIDAS,CHEQUES:DEMO_CHEQUES,CANC:DEMO_CANC,PAGOS:DEMO_PAGOS}); }
  if(new URLSearchParams(location.search).get("p")==="1"){ setTimeout(()=>window.print(),400); }
})();
window.addEventListener("hashchange",()=>{const p=readPayload(); if(p) render(p);});
</script>
</body>
</html>
