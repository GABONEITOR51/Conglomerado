<script>
/* =====================================================================
   REPORTE DE PROVEEDOR (lite) - v32
   ---------------------------------------------------------------------
   NOVEDAD v32 - ACTUALIZACION DE VIAMERICAS (noviembre 2026)
   ---------------------------------------------------------------------
   Viamericas dejo de mostrar en "Otros Creditos" los envios pagados con
   tarjeta (TCD, cliente directo a compania). Los sigue sumando en
   "Envios De Dinero", asi que su "Balance Actual" ya NO es lo que se debe;
   el monto real es "Total a Depositar Hoy" = Balance Actual - esos TCD.
   Verificado nov-2026: 8,585.27 - 5,168.00 = 3,417.27 [OK]
   El ultimo TCD acreditado fue el 11/01/2026 13:16; el primero ignorado
   el 11/08/2026 13:01.

   Regla (solo proveedor VIA): TCD con fecha >= VIA_CORTE_TCD
     - NO entra en "Otros Creditos" del Balance (igual que Viamericas)
     - la nota del statement da el monto real = Balance Actual - esos TCD
   TCD anteriores al corte: sin cambio (Creditos como siempre), por eso
   los periodos viejos dan exactamente lo mismo que en v31.
   Las cancelaciones TCD (Debitos) posteriores al corte se tratan igual
   (supuesto: aun no hay un caso real; el reporte muestra alerta).
   HEADER[12] opcional: fecha de corte m/d/aaaa para sobrescribir.

   ---------------------------------------------------------------------
   Contrato de datos (compatible con la Action actual de AppSheet):
     #d=HEADER||VENTAS||SALIDAS||CHEQUES||CANCELACIONES||PAGOS[||PAYOUT]
     sec sep: ||   fila sep: ~~   campo sep: ^

   HEADER: 0 proveedor 1 fechaIni 2 fechaFin 3 logoURL(ignorado)
           4..8 totales legacy (IGNORADOS: se recalculan en JS)
           9 generadoPor
           10 balanceInicial (saldo final del periodo anterior)  [opcional]
           11 debitosManuales (SOLO ajustes que NO son cancelaciones TCD) [opcional]
           12 corteTCD m/d/aaaa (v32, opcional; default VIA_CORTE_TCD)

   VENTAS/SALIDAS/CHEQUES: 0 fecha 1 hora 2 cliente 3 servicio
                           4 formaPago 5 monto 6 observacion 7 tipoEnvio
   CANC:   igual + 8 tipoCancel ("Money Trnsf" | "Bill Paymnt" | ... | "PAYOUT")
   PAGOS:  0 fecha 1 referencia 2 monto 3 formaPago 4 observacion
   PAYOUT: (seccion 7, OPCIONAL) mismo formato de 9 campos que CANC

   =====================================================================
   NOVEDAD v31 - PAYOUT COMO PRODUCTO PROPIO (58165L12)
   ---------------------------------------------------------------------
   Antes: el pay out era una cancelacion marcada [TipoCancel]="PAY_OUT"
   (producto 58165L1b) y venia DENTRO de la seccion CANC.
   Ahora: es su propia categoria [TipoCancel]="PAYOUT" (producto 58165L12).

   Un registro es PAY OUT si cumple CUALQUIERA de:
     a) viene en la seccion 7 (PAYOUT), o
     b) viene en CANC con [TipoCancel] = "PAYOUT" (o el legado "PAY_OUT").
   Las dos fuentes se unen y se DEDUPLICAN por fila completa, para que
   un mismo registro no se cuente dos veces si llega por ambas vias.

   "Pago de Envios" = TODOS los pay out, SIN filtrar por [TipoEnvio]:
   como ahora es un producto propio, el pay out es pago de envio por
   definicion. (Se elimino la alerta de "PAY_OUT huerfano" de v30.)

   Cancelaciones reales = CANC sin pay out. Cualquier otro valor de
   [TipoCancel] ("Money Trnsf", "Bill Paymnt", vacio...) es cancelacion.

   Eje PRODUCTO: usa [TipoEnvio] (idx 7); si viene vacio, usa
   [TipoCancel] (idx 8) como respaldo.
     contiene "bill"                    -> 'bill'
     contiene "recarga" / "pin" / "top up" -> 'rec'
     cualquier otro ("Money Trnsf"...)  -> 'mt'

   =====================================================================
   MODELO CANONICO (v27, validado contra statement real de julio 2026)
   ---------------------------------------------------------------------
     Money Transfers            = VENTAS, producto=mt
     Money Transfers - Canceled = CANC real, producto=mt
     Pago de Envios             = PAYOUT (todos)                <- v31
     Bill Payment               = VENTAS, producto=bill
     Bill Payment Canceled      = CANC real, producto=bill
     Recargas / Pin             = VENTAS, producto=rec
     Recargas Canceladas        = CANC real, producto=rec
     Credits  (se RESTA)        = VENTAS, liquidacion=card (TCD)
     Debits   (se SUMA)         = CANC real, liquidacion=card (TCD)

   INVARIANTE: toda transaccion TCD tiene efecto NETO CERO sobre el saldo.
   Los pay out NUNCA generan debito (se calculan fuera de CANC real).

   PRUEBA (statement Viamericas 07/01/2026 - 07/09/2026):
     4,896.52 + 31,412.06 + 105.46 - 1,159.54 - 17,800.00
     + 200.00 - 3,145.00 = 14,509.50 = "Total To Deposit" [OK]

   REQUISITOS DE DATOS (criticos):
     1. El monto (idx 5) debe ser el TOTAL cobrado (envio + fee + taxes).
     2. HEADER[11] es SOLO para ajustes que NO son cancelaciones TCD.
   ===================================================================== */
const SEC='||', REC='~~', F='^';
/* v32: desde esta fecha Viamericas ya no muestra los TCD en Otros Creditos */
const VIA_CORTE_TCD='11/02/2026';
const DEMO_H = ["VIAMERICAS","7/1/2026","7/9/2026","","0","0","0","0","0","805 MultiServices","4896.52",""];
const DEMO_VENTAS=[
  ["7/3/2026","10:12 AM","MARTINEZ SAUL","ENVIO/","TCD","400","tx 1674","Money Trnsf"],
  ["7/4/2026","11:03 AM","FRANCISCO JOSE","ENVIO/","TCD","210","tx 1683","Money Trnsf"],
  ["7/8/2026","2:41 PM","VICENTE TAPIA","ENVIO/","TCD","1522.50","tx 1698","Money Trnsf"],
  ["7/8/2026","4:02 PM","CORDOVA OSCAR","ENVIO/","TCD","1012.50","tx 1709","Money Trnsf"],
  ["7/1/2026","9:30 AM","JESUS GONZALEZ ROMERO","ENVIO/","EFECTIVO","82.50","PG&E","Bill Paymnt"],
  ["7/3/2026","1:15 PM","MINERVA CARRILLO ESPINO","ENVIO/","EFECTIVO","22.96","TJX","Bill Paymnt"],
  ["7/5/2026","12:10 PM","LUIS PEREZ","ENVIO/","EFECTIVO","20","Telcel","Recarga"],
  ["7/7/2026","3:45 PM","MARIA SANCHEZ","ENVIO/","EFECTIVO","30","AT&T","Recarga"]
];
const DEMO_SALIDAS=[];
const DEMO_CHEQUES=[
  ["7/1/2026","","CP - DEPOSIT VC2","CHEQUE","EFECTIVO","1008.47",""],
  ["7/7/2026","","CP - DEPOSIT VC2","CHEQUE","EFECTIVO","151.07",""]
];
const DEMO_CANC=[
  ["7/1/2026","10:05 AM","FRANCISCO JOSE","CANCELACION","TCD","200","cancel tx 1652 (venta de JUNIO)","Money Trnsf","Money Trnsf"],
  ["7/4/2026","3:20 PM","GABRIEL HERNANDEZ","CANCELACION","EFECTIVO","111","cancel tx 1666","Money Trnsf","Money Trnsf"],
  ["7/8/2026","5:44 PM","NICOLAS CARRILLO","CANCELACION","EFECTIVO","2040","cancel tx 1667","Money Trnsf","Money Trnsf"],
  ["7/5/2026","12:30 PM","LUIS PEREZ","CANCELACION","EFECTIVO","20","cancel recarga Telcel","Recarga","Recarga"]
];
const DEMO_PAGOS=[
  ["7/1/2026","BAI Deposit Agent - ATM","3600.00","ATM",""],
  ["7/6/2026","BAI Deposit Agent - ATM","3500.00","ATM",""],
  ["7/7/2026","DIRECT BANK ATM","6500.00","ATM",""],
  ["7/8/2026","SMS Deposit Agent - ATM","4200.00","ATM",""]
];
/* v31: pay out como seccion propia (producto 58165L12) */
const DEMO_PAYOUT=[
  ["7/6/2026","11:20 AM","ROSA MARIA JIMENEZ","PAYOUT","EFECTIVO","650","payout tx 1690","Money Trnsf","PAYOUT"],
  ["7/9/2026","1:05 PM","ANTONIO LOPEZ LOPEZ","PAYOUT","EFECTIVO","300","payout tx 1712","Money Trnsf","PAYOUT"]
];
function smartDecode(raw){
  let s=raw;
  try{ s=decodeURIComponent(raw); }catch(e){ s=raw; }
  if(s.indexOf(SEC)===-1 && /%[0-9A-Fa-f]{2}/.test(s)){
    try{ s=decodeURIComponent(s); }catch(e){}
  }
  return s;
}
function splitRows(sectionStr){
  const t=(sectionStr||"").trim();
  if(!t) return [];
  return t.split(REC).map(s=>s.trim()).filter(s=>s!=="").map(r=>r.split(F));
}
function readPayload(){
  let raw="";
  const h=location.hash||"";
  if(h.indexOf("#d=")===0) raw=h.slice(3);
  else if(new URLSearchParams(location.search).get("d")) raw=new URLSearchParams(location.search).get("d");
  if(!raw) return null;
  raw=smartDecode(raw);
  const parts=raw.split(SEC);
  const H=(parts[0]||"").split(F);
  return {
    H,
    VENTAS: splitRows(parts[1]),
    SALIDAS: splitRows(parts[2]),
    CHEQUES: splitRows(parts[3]),
    CANC: splitRows(parts[4]),
    PAGOS: splitRows(parts[5]),
    PAYOUT: splitRows(parts[6])   /* v31: opcional */
  };
}
function toNum(v){
  if(v===undefined||v===null) return 0;
  const n=parseFloat((""+v).replace(/[^0-9.\-]/g,""));
  return isNaN(n)?0:n;
}
function sumRows(rows,idx){
  if(!rows||!rows.length) return 0;
  return rows.reduce((a,r)=>a+toNum(r[idx]),0);
}
function money(v){return "$"+toNum(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});}
function decimalsIn(raw){
  const s=(raw==null?'':(''+raw)).replace(/[^0-9.\-]/g,'');
  const m=s.match(/\.(\d+)/);
  return m ? Math.min(m[1].length,6) : 0;
}
function moneyD(v,decimals){
  const d=Math.max(2,decimals||0);
  return "$"+toNum(v).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
}
function money2(v){
  const n=toNum(v);
  if(Math.abs(n)<0.005) return "";
  return (n<0?"-":"")+"$"+Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
}
function esc(s){return (s==null?"":""+s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function stripQuote(s){return (s==null?"":(""+s)).replace(/^['`´‘’]+/,'').trim();}
function cleanDT(s){return (s==null?"":(""+s)).replace(/^[^\d]+/,'').trim();}
function nameObs(name,obs){
  const n=esc(name||'');
  const o=(obs==null?'':(''+obs)).trim();
  return o ? n+' / '+esc(o) : n;
}
function cut(s,n){s=stripQuote(s); return s.length>n?s.slice(0,n):s;}

/* =====================================================================
   EJES CANONICOS DE CLASIFICACION
   ===================================================================== */
function esTCD(fp){
  fp=(fp==null?'':(''+fp)).toLowerCase();
  return /\btcd\b|pago directo cliente|cliente\s*directo|directo a compa/.test(fp);
}
/* Eje PRODUCTO: [TipoEnvio] (idx 7); si esta vacio, [TipoCancel] (idx 8).
   Orden: bill -> rec -> mt (default). */
function ejeProducto(r){
  const te=(''+(r[7]||'')).trim();
  const t=(te!=='' ? te : (''+(r[8]||''))).toLowerCase();
  if(/bill/.test(t)) return 'bill';
  if(/recarga|\bpin\b|top[\s_-]*up/.test(t)) return 'rec';
  return 'mt';
}
function ejeLiquid(r){ return esTCD(r[4]) ? 'card' : 'cash'; }
/* Pay out (v31.1): se detecta por CUALQUIERA de dos campos:
     idx 3 [DescripcionProducto] = "PAYOUT"  (producto 58165L12, estructural)
     idx 8 [TipoCancel]          = "PAYOUT" o el legado "PAY_OUT"
   Asi funciona aunque el payload no traiga [TipoCancel]. */
function esPayout(r){
  const d=(''+(r[3]||'')).trim().toLowerCase();
  const t=(''+(r[8]||'')).toLowerCase();
  return /^pay[\s_-]*out$/.test(d) || /pay[\s_-]*out/.test(t);
}
function montoAbs(r){ return Math.abs(toNum(r[5])); }
function agrupa(rows,prod,liq){
  const s=(rows||[]).filter(r =>
    (!prod || ejeProducto(r)===prod) && (!liq || ejeLiquid(r)===liq));
  return { n:s.length, s:s.reduce((a,r)=>a+montoAbs(r),0), rows:s };
}
/* v31: une listas sin repetir filas identicas (misma fila completa). */
function unirSinDuplicar(){
  const vistos=new Set(), out=[];
  for(const lista of arguments){
    for(const r of (lista||[])){
      const k=r.map(x=>(''+(x==null?'':x)).trim()).join('^');
      if(vistos.has(k)) continue;
      vistos.add(k); out.push(r);
    }
  }
  return out;
}

/* ---- Clasificadores de presentacion (secciones de detalle) ---- */
function ventaTipo(r){
  if(ejeLiquid(r)==='card') return 'credito';
  const p=ejeProducto(r);
  return p==='bill' ? 'bill' : (p==='rec' ? 'recarga' : 'envio');
}
function cancTipo(r){ return ejeLiquid(r)==='card' ? 'tarjeta' : 'otra'; }

/* =====================================================================
   TABLAS DE DETALLE
   ===================================================================== */
const COLS_A=`<colgroup>
  <col style="width:18%">
  <col style="width:53%">
  <col style="width:9%">
  <col style="width:8%">
  <col style="width:12%">
</colgroup>`;
function tablaTipoA(rows){
  if(!rows.length) return `<div class="empty">Sin movimientos</div>`;
  const trs=rows.map(r=>`<tr>
    <td class="nw">${esc(cleanDT(r[0]))} ${esc(cleanDT(r[1]))}</td>
    <td class="name">${nameObs(r[2],r[6])}</td>
    <td class="nw">${esc(cut(r[3],6))}</td>
    <td class="nw">${esc(cut(r[4],5))}</td>
    <td class="r">${moneyD(montoAbs(r),decimalsIn(r[5]))}</td>
  </tr>`).join("");
  return `<table>
    ${COLS_A}
    <thead><tr><th class="nw">Fecha/Hora</th><th>Cliente / Obs.</th><th>Servicio</th><th>F.Pago</th><th class="r">Monto</th></tr></thead>
    <tbody>${trs}</tbody>
  </table>`;
}
function sumAbs(rows){ return (rows||[]).reduce((a,r)=>a+montoAbs(r),0); }
function subBloque(titulo,rows){
  return `<h3 class="sub2"><span>${titulo} <span class="cnt">(${rows.length} mov.)</span></span><span class="tot">${money(sumAbs(rows))}</span></h3>${tablaTipoA(rows)}`;
}
function ventasBloques(rows,corte){
  const env =rows.filter(r=>ventaTipo(r)==='envio');
  const bil =rows.filter(r=>ventaTipo(r)==='bill');
  const rec =rows.filter(r=>ventaTipo(r)==='recarga');
  const cred=rows.filter(r=>ventaTipo(r)==='credito');
  if(env.length===0 && bil.length===0 && rec.length===0 && cred.length===0) return tablaTipoA(rows);
  let html=subBloque('Envios (Money Transfer)',env)+subBloque('Pago de biles (Bill Payment)',bil);
  if(rec.length) html+=subBloque('Recargas / Pin',rec);
  if(cred.length){
    const pc=partirPorCorte(cred,corte);
    if(pc.antes.n) html+=subBloque('Creditos (cliente directo a compania)',pc.antes.rows);
    if(pc.desde.n) html+=subBloque(`Creditos TCD desde ${fmtMDY(corte)} (no reflejados por Viamericas)`,pc.desde.rows);
  }
  return html;
}
function cancBloques(rows){
  const tar=rows.filter(r=>cancTipo(r)==='tarjeta');
  const otr=rows.filter(r=>cancTipo(r)==='otra');
  if(tar.length===0) return tablaTipoA(rows);
  let html=subBloque('Debito por cancelacion de tarjeta (TCD)',tar);
  if(otr.length) html+=subBloque('Cancelaciones (efectivo / otras)',otr);
  return html;
}
function tablaPagos(rows){
  if(!rows.length) return `<div class="empty">Sin pagos registrados</div>`;
  const trs=rows.map(r=>`<tr>
    <td class="nw">${esc(cleanDT(r[0]))}</td>
    <td class="name">${nameObs(r[1],r[4])}</td>
    <td class="nw">${esc(cut(r[3],5))}</td>
    <td class="r">${moneyD(Math.abs(toNum(r[2])),decimalsIn(r[2]))}</td>
  </tr>`).join("");
  return `<table>
    <colgroup>
      <col style="width:18%"><col style="width:62%"><col style="width:8%"><col style="width:12%">
    </colgroup>
    <thead><tr><th class="nw">Fecha</th><th>Referencia / Obs.</th><th>F.Pago</th><th class="r">Monto</th></tr></thead>
    <tbody>${trs}</tbody>
  </table>`;
}

/* =====================================================================
   STATEMENT VIAMERICAS (tabla superior)
   ===================================================================== */
/* v32: fechas m/d/aaaa (formato del payload de AppSheet) */
function parseMDY(s){
  const m=cleanDT(s).match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if(!m) return null;
  let y=parseInt(m[3],10); if(y<100) y+=2000;
  return new Date(y,parseInt(m[1],10)-1,parseInt(m[2],10));
}
function fmtMDY(d){ return d ? pad2(d.getMonth()+1)+'/'+pad2(d.getDate())+'/'+d.getFullYear() : ''; }
function diaAnterior(s){ const d=parseMDY(s); if(!d) return null; d.setDate(d.getDate()-1); return d; }
/* Separa filas en [antes del corte, desde el corte]. Sin corte: todo "antes". */
function partirPorCorte(rows,corte){
  const antes=[], desde=[];
  for(const r of (rows||[])){
    const d=parseMDY(r[0]);
    (corte && d && d>=corte ? desde : antes).push(r);
  }
  const res=x=>({n:x.length, s:x.reduce((a,r)=>a+montoAbs(r),0), rows:x});
  return {antes:res(antes), desde:res(desde)};
}
/* Formato de importes igual que Viamericas: $1,234.56 / $-1,234.56 */
function viaMoney(v){
  let n=toNum(v); if(Math.abs(n)<0.005) n=0;
  const t=Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
  return (n<0?'$-':'$')+t;
}
function vVal(v,extra){ const n=toNum(v); return `<td class="v${n<-0.004?' neg':''}${extra?' '+extra:''}">${viaMoney(v)}</td>`; }
function vCnt(n){ return `<td class="q">${(n||n===0)?n:''}</td>`; }
/* fila de 3 columnas (Concepto/Cantidad/Valor); sinDato = concepto que el
   reporte no trae: se pinta en rojo y sin valores (editar manualmente) */
function r3(c,n,v,opt){
  opt=opt||{};
  if(opt.sinDato) return `<tr><td class="k red">${c}</td><td class="q"></td><td class="v"></td></tr>`;
  return `<tr${opt.b?' class="b"':''}><td class="k">${c}</td>${vCnt(n)}${vVal(v)}</tr>`;
}
function r2(c,v,opt){
  opt=opt||{};
  if(opt.sinDato) return `<tr><td class="k red">${c}</td><td class="v"></td></tr>`;
  return `<tr${opt.b?' class="b"':''}><td class="${opt.sub?'k2':'k'}${opt.red?' red':''}">${c}</td>${vVal(v,opt.tot?'tot':'')}</tr>`;
}
function vbox(titulo,cabecera,filas,cls,tcls){
  return `<div class="vbox${cls?' '+cls:''}"><div class="vt${tcls?' '+tcls:''}">${titulo}</div>
    <table><thead><tr>${cabecera.map((h,i)=>`<th${i?' class="r"':''}>${h}</th>`).join('')}</tr></thead>
    <tbody>${filas}</tbody></table></div>`;
}
function statementTable(S,T,ctx){
  const {balIni,balIniSet,debManual,fechaIni,fechaFin,pagos,corte,cred,deb}=ctx;
  /* ---- Envios De Dinero (orden Viamericas) ---- */
  const subN=S.mtAlta.n-S.mtCanc.n, subA=S.mtAlta.s-S.mtCanc.s;
  const totN=subN+S.mtPay.n,        totA=subA-S.mtPay.s;   /* VIA suma la cantidad de pagados */
  /* ---- Otros Servicios ---- */
  const otrN=(S.bilAlta.n-S.bilCanc.n)+(S.recAlta.n-S.recCanc.n);
  const otrA=(S.bilAlta.s-S.bilCanc.s)+(S.recAlta.s-S.recCanc.s);
  /* ---- Balance (formato proveedor) ---- */
  const bDeb = deb.antes.s+debManual;          /* Otros Debitos visibles */
  const bCred= -cred.antes.s;                  /* Otros Creditos visibles */
  const bAct = toNum(balIni)+totA+otrA-T.cheques-T.pagos+bDeb+bCred;
  /* ---- Total a Depositar (dinero real) ---- */
  const totDep = bAct - cred.desde.s + deb.desde.s;
  const hayOcultos = cred.desde.n>0 || deb.desde.n>0;
  const cierre = diaAnterior(fechaIni);
  const corteTxt = fmtMDY(corte);

  /* Fila 1: Balance */
  let fBal = r2(`Balance al cierre del ${cierre?fmtMDY(cierre):'periodo anterior'}`,balIni,{red:!balIniSet})
    + r2('Envíos De Dinero',totA)
    + r2('Otros Servicios',otrA)
    + r2('Cheques Procesados',-T.cheques)
    + r2('Depósitos / Viasafe',-T.pagos)
    + r2('Otros Débitos',bDeb) + (Math.abs(bDeb)>0.004 ? r2('Otros Ajustes',bDeb,{sub:true}) : '')
    + r2('Otros Créditos',bCred) + (Math.abs(bCred)>0.004 ? r2('Otros Ajustes',bCred,{sub:true}) : '')
    + r2('Balance Actual',bAct,{b:true});

  /* Fila 2: Envios De Dinero | Otros Servicios | Cheques Procesados */
  const fEnv = r3('Envíos De Dinero',S.mtAlta.n,S.mtAlta.s)
    + r3('Envíos De Dinero - Cancelados',S.mtCanc.n?-S.mtCanc.n:0,-S.mtCanc.s)
    + r3('Envíos De Dinero - Anulados',0,0,{sinDato:true})
    + r3('Subtotal',subN,subA,{b:true});
  const fDom = r3('Envíos Domésticos Pagados',S.mtPay.n,-S.mtPay.s)
    + r3('Total Envíos De Dinero',totN,totA,{b:true});
  const fOtr = r3('Pago de Biles',S.bilAlta.n,S.bilAlta.s)
    + r3('Pago de Biles Internacionales',0,0,{sinDato:true})
    + r3('Money Orders',0,0,{sinDato:true})
    + r3('Recargas / PIN / Pinless',S.recAlta.n,S.recAlta.s)
    + r3('Pago de Biles - Cancelados',S.bilCanc.n?-S.bilCanc.n:0,-S.bilCanc.s)
    + r3('Recargas Canceladas',S.recCanc.n?-S.recCanc.n:0,-S.recCanc.s)
    + r3('Total Otros Servicios',otrN,otrA,{b:true});
  const fChq = r3('Total Cheques Procesados',T.nCheques,T.cheques,{b:true});
  const fPen = r3('En Revisión (Hold)',0,0,{sinDato:true})
    + r3('Cuenta Temporal',0,0,{sinDato:true});

  const html = `<div class="via">
    <div class="via-head">805 MultiServices</div>
    <div class="via-dias">Al cierre del ${esc(cleanDT(fechaFin))} &middot; Días de Pago: Lunes, <b>Miércoles</b> y Viernes</div>
    <div class="via-row">
      ${vbox('Balance',['Concepto','Valor'],fBal,'','gris')}
    </div>
    <div class="via-row">
      <div>${vbox('Envíos De Dinero',['Concepto','Cantidad','Valor'],fEnv)}
           ${vbox('Envíos Domésticos',['Concepto','Cantidad','Valor'],fDom)}</div>
      ${vbox('Otros Servicios',['Concepto','Cantidad','Valor'],fOtr)}
      <div>${vbox('Cheques Procesados',['Concepto','# Cheques','Valor'],fChq)}
           ${vbox('Cheques Pendientes de Procesar',['Concepto','Cantidad','Valor'],fPen)}</div>
    </div>
  </div>`;

  const notaDeb = deb.antes.n>0
    ? ` <b>Otros Débitos</b> = ${deb.antes.n} cancelación(es) TCD por ${money(deb.antes.s)}${debManual?` + ${money(debManual)} de ajuste manual`:''}: revierten el crédito de la venta original.`
    : ``;
  const notaCorte = hayOcultos
    ? ` <b>Actualización Viamericas (desde ${corteTxt})</b>: el proveedor ya no muestra los envíos pagados con tarjeta (TCD) en Otros Créditos, pero los sigue sumando en Envíos De Dinero. Por eso el <b>Balance Actual</b> aquí es igual al del proveedor. Monto real a depositar = Balance Actual ${viaMoney(bAct)} − ${money(cred.desde.s)}${deb.desde.n?` + ${money(deb.desde.s)}`:''} de TCD no reflejados = <b>${viaMoney(totDep)}</b> (equivale a "Total a Depositar Hoy" del portal).`
    : (corte ? ` Corte TCD Viamericas: ${corteTxt} (sin TCD posteriores en el periodo).` : ``);
  const warn = (S.payTCD.n>0
    ? `<div class="stmt-warn">ALERTA: ${S.payTCD.n} pay out(s) con forma de pago TCD (${money(S.payTCD.s)}). Se restan en "Envíos Domésticos Pagados" pero no generan débito: revisa [FormaPago] en AppSheet.</div>`
    : ``)
    + (deb.desde.n>0
    ? `<div class="stmt-warn">VERIFICAR: ${deb.desde.n} cancelación(es) TCD posteriores al ${corteTxt} (${money(deb.desde.s)}) se sacaron de Otros Débitos por la nueva regla de Viamericas. Confirma contra el estado de cuenta del portal.</div>`
    : ``);
  return `${html}
  ${warn}
  <div class="stmt-note">Statement de proveedor (Viamericas) &middot; v32.1. <b style="color:#d00">Valores en rojo</b> = sin dato en el reporte: editar manualmente. Balance al cierre = saldo final del periodo anterior. Cheques Procesados y Depósitos/Viasafe son abonos (restan al saldo a depositar).${notaDeb}${notaCorte}</div>`;
}


/* =====================================================================
   v32.1 - DETALLE con formato Viamericas, en el orden del Balance:
   Envios De Dinero > Otros Servicios > Cheques Procesados >
   Depositos / Viasafe > Otros Debitos > Otros Creditos
   Signos igual que el proveedor: lo que resta va en verde con $-.
   ===================================================================== */
function fpCorta(fp){
  if(esTCD(fp)) return 'TCD';
  const t=stripQuote(fp).toUpperCase();
  if(/^EFECTIVO/.test(t)) return 'EF';
  if(/^ZELLE/.test(t)) return 'ZE';
  return t.slice(0,5);
}
const COLS_V=`<colgroup><col style="width:17%"><col style="width:50%"><col style="width:11%"><col style="width:8%"><col style="width:14%"></colgroup>`;
const COLS_P=`<colgroup><col style="width:17%"><col style="width:61%"><col style="width:8%"><col style="width:14%"></colgroup>`;
/* signo: +1 se muestra positivo, -1 se muestra como $- (verde) */
function vTabla(titulo,rows,signo,nota){
  const tot=sumAbs(rows)*signo;
  const body = rows.length
    ? rows.map(r=>`<tr>
        <td class="k nw">${esc(cleanDT(r[0]))} ${esc(cleanDT(r[1]))}</td>
        <td class="name">${nameObs(r[2],r[6])}</td>
        <td class="nw">${esc(cut(r[3],8))}</td>
        <td class="nw">${esc(fpCorta(r[4]))}</td>
        ${vVal(montoAbs(r)*signo)}</tr>`).join('')
    : `<tr><td class="k vacio" colspan="5">Sin movimientos</td></tr>`;
  return `<div class="vbox"><div class="vt"><span>${titulo}</span><span class="n">${rows.length} mov.</span></div>
    <table>${COLS_V}<thead><tr><th>Fecha/Hora</th><th>Cliente / Obs.</th><th>Servicio</th><th>F.Pago</th><th class="r">Valor</th></tr></thead>
    <tbody>${body}<tr class="b"><td class="k" colspan="3">Total ${titulo}</td><td class="q">${rows.length}</td>${vVal(tot)}</tr></tbody></table>
    ${nota?`<div class="nota" style="padding:3px 8px">${nota}</div>`:''}</div>`;
}
function vTablaPagos(titulo,rows,signo){
  const tot=(rows||[]).reduce((a,r)=>a+Math.abs(toNum(r[2])),0)*signo;
  const body = rows.length
    ? rows.map(r=>`<tr>
        <td class="k nw">${esc(cleanDT(r[0]))}</td>
        <td class="name">${nameObs(r[1],r[4])}</td>
        <td class="nw">${esc(cut(r[3],5))}</td>
        ${vVal(Math.abs(toNum(r[2]))*signo)}</tr>`).join('')
    : `<tr><td class="k vacio" colspan="4">Sin depósitos</td></tr>`;
  return `<div class="vbox"><div class="vt"><span>${titulo}</span><span class="n">${rows.length} mov.</span></div>
    <table>${COLS_P}<thead><tr><th>Fecha</th><th>Referencia / Obs.</th><th>F.Pago</th><th class="r">Valor</th></tr></thead>
    <tbody>${body}<tr class="b"><td class="k" colspan="2">Total ${titulo}</td><td class="q">${rows.length}</td>${vVal(tot)}</tr></tbody></table></div>`;
}
function vSec(titulo,valor){
  const n=toNum(valor);
  return `<div class="vsec"><span>${titulo}</span><span class="amt${n<-0.004?' neg':''}">${viaMoney(valor)}</span></div>`;
}
function detalleVia(c){
  const {P,S,T,CANC_REAL,CANC_PAY,corte,cred,deb}=c;
  const byProd=(rows,p)=>(rows||[]).filter(r=>ejeProducto(r)===p);
  const mtV=byProd(P.VENTAS,'mt'), mtC=byProd(CANC_REAL,'mt');
  const biV=byProd(P.VENTAS,'bill'), biC=byProd(CANC_REAL,'bill');
  const reV=byProd(P.VENTAS,'rec'),  reC=byProd(CANC_REAL,'rec');
  const totEnv = sumAbs(mtV)-sumAbs(mtC)-sumAbs(CANC_PAY);
  const totOtr = sumAbs(biV)+sumAbs(reV)-sumAbs(biC)-sumAbs(reC);
  const ct = fmtMDY(corte);
  let h='<div class="vdet">';
  /* 1. Envios De Dinero */
  h+=vSec('Envíos De Dinero',totEnv);
  h+=vTabla('Envíos De Dinero',mtV,1, cred.desde.n||cred.antes.n ? 'Incluye los envíos pagados con tarjeta (TCD); se restan aparte en Otros Créditos (o, desde el corte, del monto real a depositar).' : '');
  h+=vTabla('Envíos De Dinero - Cancelados',mtC,-1);
  h+=vTabla('Envíos Domésticos Pagados',CANC_PAY,-1);
  /* 2. Otros Servicios */
  h+=vSec('Otros Servicios',totOtr);
  h+=vTabla('Pago de Biles',biV,1);
  if(reV.length) h+=vTabla('Recargas / PIN / Pinless',reV,1);
  if(biC.length) h+=vTabla('Pago de Biles - Cancelados',biC,-1);
  if(reC.length) h+=vTabla('Recargas Canceladas',reC,-1);
  /* 3. Cheques Procesados (abono) */
  h+=vSec('Cheques Procesados',-T.cheques);
  h+=vTabla('Cheques Procesados',P.CHEQUES||[],1);
  /* 4. Depositos / Viasafe */
  h+=vSec('Depósitos / Viasafe',-T.pagos);
  h+=vTablaPagos('Depósitos / Viasafe',P.PAGOS||[],1);
  /* 5. Otros Debitos (cancelaciones TCD) */
  h+=vSec('Otros Débitos',deb.antes.s);
  h+=vTabla('Otros Débitos (cancelación TCD)',deb.antes.rows,1);
  if(deb.desde.n) h+=vTabla(`Débitos TCD desde ${ct} (no reflejados por Viamericas)`,deb.desde.rows,1);
  /* 6. Otros Creditos (ventas TCD) */
  h+=vSec('Otros Créditos',-cred.antes.s);
  h+=vTabla('Otros Créditos (cliente directo a compañía)',cred.antes.rows,-1);
  if(cred.desde.n) h+=vTabla(`Créditos TCD desde ${ct} (no reflejados por Viamericas)`,cred.desde.rows,-1,
      'Viamericas ya no los muestra en el Balance; se restan del Balance Actual para obtener el monto real a depositar.');
  h+=`<div class="nota">Cheques Procesados y Depósitos/Viasafe son abonos: restan al saldo a depositar. Toda transacción TCD tiene efecto neto cero: al alta se resta como Crédito, al cancelarse se suma como Débito. Envíos Domésticos Pagados = efectivo entregado al beneficiario (pay out): resta del total de envíos, no genera débito.</div>`;
  return h+'</div>';
}
/* ===================================================================== */
function pad2(n){n=parseInt(n,10)||0; return (n<10?'0':'')+n;}
function fileDate(s){
  s=cleanDT(s);
  const m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if(!m) return s.replace(/[^\w-]/g,'');
  return pad2(m[1])+'-'+pad2(m[2])+'-'+m[3];
}
function fileProv(s){
  s=(""+(s||'')).trim();
  const t=s.replace(/[^A-Za-zÀ-ÿ]/g,'').slice(0,3);
  return t.charAt(0).toUpperCase()+t.slice(1).toLowerCase();
}
function render(P){
  const H=P.H, g=i=>H[i]!==undefined?H[i]:"";

  /* v31: PAYOUT = seccion propia (todas sus filas) + filas de CANC
     etiquetadas PAYOUT/PAY_OUT, sin duplicar. */
  const CANC_PAY  = unirSinDuplicar(P.PAYOUT||[], (P.CANC||[]).filter(r=>esPayout(r)));
  const CANC_REAL = (P.CANC||[]).filter(r=>!esPayout(r));

  const S={
    mtAlta : agrupa(P.VENTAS, 'mt',  null),
    mtCanc : agrupa(CANC_REAL,'mt',  null),
    mtPay  : agrupa(CANC_PAY,  null, null),   // v31: todos los pay out
    bilAlta: agrupa(P.VENTAS, 'bill',null),
    bilCanc: agrupa(CANC_REAL,'bill',null),
    recAlta: agrupa(P.VENTAS, 'rec', null),
    recCanc: agrupa(CANC_REAL,'rec', null),
    credits: agrupa(P.VENTAS,  null,'card'),
    debits : agrupa(CANC_REAL, null,'card'),
    payTCD : agrupa(CANC_PAY,  null,'card')   // v31: solo para alerta
  };

  const T={
    ventas:    sumAbs(P.VENTAS),
    ventasEnv: sumAbs(P.VENTAS.filter(r=>ventaTipo(r)==='envio')),
    ventasBil: sumAbs(P.VENTAS.filter(r=>ventaTipo(r)==='bill')),
    ventasRec: sumAbs(P.VENTAS.filter(r=>ventaTipo(r)==='recarga')),
    ventasCred:S.credits.s,
    salidas:   sumAbs(P.SALIDAS),
    cheques:   sumAbs(P.CHEQUES),
    canc:      sumAbs(CANC_REAL),
    payout:    S.mtPay.s,
    cancTar:   S.debits.s,
    cancOtra:  sumAbs(CANC_REAL.filter(r=>cancTipo(r)==='otra')),
    pagos:     (P.PAGOS||[]).reduce((a,r)=>a+Math.abs(toNum(r[2])),0)
  };

  const balIniSet = H[10]!==undefined && (''+H[10]).trim()!=='';
  const balIni    = toNum(H[10]);
  const debSet    = H[11]!==undefined && (''+H[11]).trim()!=='';
  const debManual = toNum(H[11]);

  /* v32: corte de la actualizacion de Viamericas (solo proveedor VIA) */
  const esVia = /via/i.test(g(0));
  const corte = esVia ? (parseMDY((''+(H[12]||'')).trim()) || parseMDY(VIA_CORTE_TCD)) : null;
  const cred  = partirPorCorte(S.credits.rows, corte);
  const deb   = partirPorCorte(S.debits.rows,  corte);
  T.nCheques  = (P.CHEQUES||[]).length;

  document.title = `${fileProv(g(0))}_${fileDate(g(1))}_${fileDate(g(2))}`;
  document.getElementById("sheet").innerHTML=`
  <h1>Reporte de proveedor: ${esc(g(0)||'PROVEEDOR')}</h1>
  <div class="sub">805 MultiServices &middot; Periodo: ${esc(cleanDT(g(1)))} a ${esc(cleanDT(g(2)))} &middot; Generado por: ${esc(g(9)||'-')} &middot; v32.1</div>
  ${statementTable(S,T,{balIni,balIniSet,debManual,fechaIni:g(1),fechaFin:g(2),pagos:P.PAGOS,corte,cred,deb})}
  ${detalleVia({P,S,T,CANC_REAL,CANC_PAY,corte,cred,deb})}
  `;
}
/* ---------------- diagnostico (URL ...?dbg=1#d=...) ---------------- */
function showDebug(p){
  if(new URLSearchParams(location.search).get("dbg")!=="1") return;
  const box=document.createElement("pre");
  box.style.cssText="white-space:pre-wrap;font:11px/1.4 monospace;background:#1f2933;color:#d6e2f0;"+
    "padding:12px 14px;margin:14px auto;max-width:8.5in;border-radius:8px;overflow:auto";
  if(!p){ box.textContent="DIAGNOSTICO: no llego #d= (se muestra el DEMO)."; document.body.appendChild(box); return; }
  const secs=[["VENTAS",p.VENTAS,8],["SALIDAS",p.SALIDAS,8],["CHEQUES",p.CHEQUES,8],
              ["CANC",p.CANC,9],["PAGOS",p.PAGOS,5],["PAYOUT (sec 7)",p.PAYOUT,9]];
  let t="DIAGNOSTICO v32.1\nHEADER: "+p.H.length+" campos\n\n";
  for(const [n,rows,esp] of secs){
    t+=n+": "+rows.length+" filas";
    if(rows.length){
      const r=rows[0];
      t+=" | 1a fila: "+r.length+" campos"+(r.length<esp?"  <-- esperaba "+esp:"")+
         "\n   ["+r.map((x,i)=>i+":"+(x===""?"·":x)).join(" | ")+"]";
    }
    t+="\n";
  }
  const pc=(p.CANC||[]).filter(esPayout).length;
  t+="\nPayouts detectados dentro de CANC: "+pc+
     "\nPayouts en seccion 7: "+(p.PAYOUT||[]).length+
     "\n\nSi ambos son 0, los payouts NO vienen en el payload: el problema esta en el slice o en la Action, no en este HTML.";
  box.textContent=t;
  document.body.appendChild(box);
}
(function(){
  const p=readPayload();
  showDebug(p);
  if(p){ render(p); }
  else { render({H:DEMO_H,VENTAS:DEMO_VENTAS,SALIDAS:DEMO_SALIDAS,CHEQUES:DEMO_CHEQUES,CANC:DEMO_CANC,PAGOS:DEMO_PAGOS,PAYOUT:DEMO_PAYOUT}); }
  if(new URLSearchParams(location.search).get("p")==="1"){ setTimeout(()=>window.print(),400); }
})();
window.addEventListener("hashchange",()=>{const p=readPayload(); if(p) render(p);});
</script>
